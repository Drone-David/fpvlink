# FPVLink — settle the WiFi driver race deterministically.
#
# The Armbian vendor kernel ships TWO drivers that both claim the Archer
# T3U Nano (RTL8812BU, USB 2357:012e):
#
#   rtw88_8822bu  mainline, mac80211-based.  RTL8812BU and RTL8822BU are the
#                 same silicon, so mainline's rtw88 binds it. This is the one
#                 we want: hostapd talks nl80211 to mac80211, and AP mode was
#                 verified working on it (see docs/wifi-ap-research.md §4.2).
#
#   88x2bu        Realtek's out-of-tree vendor blob, v5.13.1 (2021). Full-MAC,
#                 with its own AP implementation that hostapd drives
#                 inconsistently.
#
# Left alone, whichever registers its USB interface driver first wins. On
# every boot observed so far rtw88 won — but that is a race, not a decision.
# If it ever flipped, hostapd would be talking to a driver its config was not
# written for, and the failure would look like broken hardware rather than a
# changed binding.
#
# So blacklist the vendor blob. Note this is `blacklist`, NOT `install ...
# /bin/false`: it stops the module being auto-loaded on USB alias match, but
# `modprobe 88x2bu` by hand still works. That is deliberate — the blob stays
# available as a fallback if a future kernel regresses rtw88's USB AP support.
#
# Verify which driver actually bound with:
#   basename $(readlink /sys/class/net/wlan0/device/driver)   -> rtw_8822bu
#
# To revert: rm /etc/modprobe.d/fpvlink-wifi.conf && reboot

blacklist 88x2bu
