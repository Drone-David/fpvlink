# FPVLink field access point — hostapd configuration TEMPLATE.
#
# This is the repo copy. The live file is /etc/hostapd/fpvlink.conf, written
# by setup/07-wifi-ap.sh with the passphrase filled in and mode 0600.
#
# The passphrase is deliberately NOT in this file and must never be committed
# — setup/07-wifi-ap.sh prompts for it (or reads FPVLINK_AP_PASSPHRASE).

interface=wlan0
driver=nl80211
ssid=FPVLink

# --- Band and channel: 2.4GHz, and this is not negotiable ------------------
#
# The whole of 5GHz is reserved for DJI video. DJI's FPV downlink occupies
# 5.725-5.850 GHz, and the 5GHz channels an AP would otherwise want (149-165,
# 5745-5825 MHz) sit directly inside it. Beaconing there, on the very box
# whose job is receiving that video, is the one failure you do not want to be
# debugging at a flying field. Treating all of 5GHz as spoken for costs
# nothing here — a phone standing next to the box does not need the extra
# bandwidth.
#
# Channel 6 is the middle of the three non-overlapping 2.4GHz channels. Move
# to 1 or 11 if a site is congested; do not use anything else, as the other
# channels overlap their neighbours.
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1

# --- Regulatory ------------------------------------------------------------
#
# This is load-bearing, not paperwork. The box boots with regdomain "country
# 00" (the world domain), in which every 5GHz range and several 2.4GHz ranges
# are flagged no-IR — the radio may not initiate radiation, so it cannot
# beacon, so hostapd cannot start at all.
#
# Setting country_code here with ieee80211d=1 makes hostapd apply the domain
# itself at startup. That is why there is no separate `iw reg set` unit: one
# file owns both the country and the channel, and there is no ordering
# dependency between two things that could race.
#
# Must match where the box is actually flown.
country_code=US
ieee80211d=1

# --- Security --------------------------------------------------------------
# WPA2-PSK / CCMP only. No WPA1, no TKIP, no WPS.
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=__SET_BY_SETUP_SCRIPT__
