# FPVLink journald override — installed by setup/01-system.sh to
# /etc/systemd/journald.conf.d/fpvlink.conf
#
# Default Storage=volatile keeps the journal in RAM only, wiped on every
# reboot. For a field-deployed, often-offline device with no one watching a
# screen, that means the one log that would explain a crash is gone the
# moment the crash causes (or is followed by) a reboot — including the
# pipeline's own cold-boot warm-restart, which quits and respawns on every
# single boot. Persistent storage is what makes "Download Diagnostics" in the
# dashboard (scripts/collect-diagnostics.sh) actually useful after the fact.
#
# Typical deployments have 20G+ free on the eMMC, so this costs nothing that
# matters. SystemMaxUse caps total size; MaxRetentionSec is a belt-and-braces
# time cap so old entries age out even if the size cap is never reached.
[Journal]
Storage=persistent
SystemMaxUse=200M
MaxRetentionSec=2week
