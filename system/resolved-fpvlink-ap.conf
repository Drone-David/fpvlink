# FPVLink — let systemd-resolved answer DNS for AP clients.
#
# Installed by setup/07-wifi-ap.sh to
# /etc/systemd/resolved.conf.d/fpvlink-ap.conf
#
# By default systemd-resolved's stub listener binds 127.0.0.53 only, so a
# phone told "your DNS server is 10.10.20.1" would get nothing back. This
# adds a second stub listener on the AP address.
#
# It is not optional. 06-fpvlink-ap.network advertises 10.10.20.1 as the
# resolver over DHCP, and a phone that gets a resolver which never answers
# behaves the same as one given no resolver at all — it stops using the
# interface entirely, including for on-link addresses. See that file for the
# full story.
#
# When the box has an Ethernet uplink this resolves for real. In the field it
# fails fast with SERVFAIL, which is the correct outcome and still keeps the
# phone happy enough to use the network for the dashboard.
#
# To revert: rm /etc/systemd/resolved.conf.d/fpvlink-ap.conf
#            systemctl restart systemd-resolved

[Resolve]
DNSStubListenerExtra=10.10.20.1
